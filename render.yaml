services:
  - type: web
    name: todo-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: cd apps/api && node dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: todo-db
          property: connectionString
    healthCheckPath: /health

databases:
  - name: todo-db
    databaseName: todo_app
    user: todouser
